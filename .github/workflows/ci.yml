name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Клиент Prisma нужен для типов: без него не пройдёт ни tsc, ни тесты
      - run: pnpm exec prisma generate

      - name: Типы
        run: pnpm typecheck

      - name: Линт
        run: pnpm lint

      - name: Unit-тесты
        run: pnpm test

      - name: Сборка
        run: pnpm exec next build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
          AUTH_SECRET: ci-build-secret-not-used-at-runtime
          NEXTAUTH_URL: https://vin2win.online
