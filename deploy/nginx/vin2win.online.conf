# VIN2WIN CRM — reverse proxy.
# Кладётся в /etc/nginx/sites-available/vin2win.online и линкуется в sites-enabled.

upstream vin2win_crm {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Лимит попыток входа на уровне nginx — второй рубеж поверх серверного
limit_req_zone $binary_remote_addr zone=vin2win_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vin2win.online www.vin2win.online crm.vin2win.online;

    # Валидация certbot должна проходить без редиректа
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vin2win.online$request_uri;
    }
}

# www и crm — алиасы на основной домен (ТЗ 8.2)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vin2win.online crm.vin2win.online;

    ssl_certificate     /etc/letsencrypt/live/vin2win.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vin2win.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vin2win.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vin2win.online;

    ssl_certificate     /etc/letsencrypt/live/vin2win.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vin2win.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS дублируем и здесь: заголовок должен стоять даже на ответах nginx
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    server_tokens off;
    client_max_body_size 8m;

    access_log /var/log/nginx/vin2win-crm.access.log;
    error_log  /var/log/nginx/vin2win-crm.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SSE: буферизация убьёт поток событий, а таймаут в 60 секунд оборвёт
    # соединение раньше heartbeat (ТЗ 6)
    location /api/events/stream {
        proxy_pass http://vin2win_crm;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location = /api/auth/callback/credentials {
        limit_req zone=vin2win_login burst=5 nodelay;

        proxy_pass http://vin2win_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика Next неизменяемая: хешируется при сборке
    location /_next/static/ {
        proxy_pass http://vin2win_crm;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://vin2win_crm;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
